<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planta Interativa - Controle de Luzes</title>
    <style>
        :root {
            --purple-x11: #AA1ADA;
            --hyper-magenta: #BB1DF0;
            --neon-violet: #CB4FF0;
            --violet: #DA81EF;
            --bg-dark: #0b020e;
            --wall-color: #3a074d;
            --text-light: #ffffff;
            --panel-bg: #16041c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at center, #1f0529 0%, var(--bg-dark) 70%);
        }

        h1 {
            margin-bottom: 5px;
            font-size: 2rem;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(203, 79, 240, 0.5);
            letter-spacing: 1px;
        }

        p {
            margin-bottom: 30px;
            color: #a68ba9;
            font-size: 0.95rem;
            font-weight: 300;
        }

        /* Container da Planta */
        .planta-container {
            width: 100%;
            max-width: 750px;
            aspect-ratio: 4 / 3;
            background-color: var(--panel-bg);
            border: 3px solid rgba(170, 26, 218, 0.3);
            border-radius: 16px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            padding: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(170, 26, 218, 0.1);
        }

        /* Estilização Geral dos Cômodos */
        .comodo {
            background-color: rgba(37, 9, 46, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: border-color 0.3s, box-shadow 0.1s, background-color 0.1s;
            padding: 15px;
            backdrop-filter: blur(5px);
        }

        .comodo-nome {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 4px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        /* Indicador de Porcentagem / Status */
        .status-luz {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 4px 12px;
            border-radius: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            color: #705575;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        /* -------------------------------------------
           ESTILIZAÇÃO DOS SLIDERS
        ------------------------------------------- */
        .container-slider {
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slider-controle {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
        }

        .slider-controle::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            transition: transform 0.1s;
        }

        .slider-controle::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .slider-controle::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        /* Botões para os cômodos ON/OFF */
        .btn-comodo {
            cursor: pointer;
            user-select: none;
        }
        
        .btn-comodo:hover {
            border-color: rgba(211, 104, 240, 0.4);
            background-color: rgba(37, 9, 46, 0.7);
            transform: translateY(-2px);
        }

        .btn-comodo .status-luz {
            margin-bottom: 0;
        }

        /* Configuração do Layout do Grid */
        .sala { grid-column: 1 / 3; grid-row: 1 / 3; }
        .cozinha { grid-column: 3 / 5; grid-row: 1 / 2; }
        .banheiro { grid-column: 3 / 5; grid-row: 2 / 3; }
        .quarto { grid-column: 1 / 5; grid-row: 3 / 4; }

        /* Estados Acesos Estáticos para Cozinha e Banheiro */
        .cozinha.aceso { 
            background-color: var(--hyper-magenta); 
            border-color: rgba(255,255,255,0.2);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.2), 0 0 20px rgba(187, 29, 240, 0.4); 
        }
        .banheiro.aceso { 
            background-color: var(--violet); 
            border-color: rgba(255,255,255,0.2);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.2), 0 0 20px rgba(218, 129, 239, 0.4); 
        }
        .comodo.aceso .comodo-nome { color: #ffffff; }
        .cozinha.aceso .status-luz, .banheiro.aceso .status-luz { 
            background-color: #ffffff; 
            color: #000000; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h1>Planta Interativa Automatizada</h1>
    <p>Ajuste a intensidade dos dimmers ou ligue/desligue os interruptores.</p>

    <div class="planta-container">
    
        <div id="sala" class="comodo sala">
            <span class="comodo-nome">Sala de Estar</span>
            <span class="status-luz" id="pct-sala">0%</span>
            <div class="container-slider">
                <input type="range" min="0" max="255" value="0" class="slider-controle" oninput="atualizarInterfaceSlider('S', this.value, 'sala', 'pct-sala', 170, 26, 218)">
            </div>
        </div>

        <div class="comodo cozinha btn-comodo" onclick="alternarLuz(this, 'C', 'c')">
            <span class="comodo-nome">Cozinha</span>
            <span class="status-luz">Apagada</span>
        </div>

        <div class="comodo banheiro btn-comodo" onclick="alternarLuz(this, 'B', 'b')">
            <span class="comodo-nome">Banheiro</span>
            <span class="status-luz">Apagada</span>
        </div>

        <div id="quarto" class="comodo quarto">
            <span class="comodo-nome">Dormitório</span>
            <span class="status-luz" id="pct-quarto">0%</span>
            <div class="container-slider">
                <input type="range" min="0" max="255" value="0" class="slider-controle" oninput="atualizarInterfaceSlider('Q', this.value, 'quarto', 'pct-quarto', 203, 79, 240)">
            </div>
        </div>

    </div>

    <script>
        const IP_REDE = "10.139.26.146"; // Seu IP de rede local
        
        // Controle de tempo para não inundar o Python/Arduino de requisições
        let timersHardware = { 'S': null, 'Q': null };

        function enviarComandoHardware(letra, valor = "") {
            fetch(`http://${IP_REDE}:8080/?comando=${letra}${valor}`)
                .catch(erro => console.error("Erro ao enviar para o Python:", erro));
        }

        function atualizarInterfaceSlider(letraComodo, valor, idElemento, idTextoPct, r, g, b) {
            // 1. ATUALIZAÇÃO VISUAL IMEDIATA NA TELA (100% Fluido)
            const elemento = document.getElementById(idElemento);
            const textoPct = document.getElementById(idTextoPct);
            const porcentagem = Math.round((valor / 255) * 100);
            
            textoPct.innerText = `${porcentagem}%`;
            const fatorOpacidade = valor / 255;

            if(valor > 0) {
                elemento.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${0.15 + (fatorOpacidade * 0.75)})`;
                elemento.style.borderColor = `rgba(255, 255, 255, ${0.05 + (fatorOpacidade * 0.2)})`;
            } else {
                elemento.style.backgroundColor = "rgba(37, 9, 46, 0.4)";
                elemento.style.borderColor = "rgba(255, 255, 255, 0.05)";
            }

            // 2. CONTROLE TRAVA-ENVIO (Envia apenas o último valor após parar de arrastar rápido)
            clearTimeout(timersHardware[letraComodo]);
            timersHardware[letraComodo] = setTimeout(() => {
                enviarComandoHardware(letraComodo, valor);
            }, 40); // 40 milissegundos de intervalo é o tempo perfeito para o Arduino respirar
        }

        function alternarLuz(comodo, letraLigar, letraDesligar) {
            comodo.classList.toggle('aceso');
            const statusTxt = comodo.querySelector('.status-luz');
            
            if (comodo.classList.contains('aceso')) {
                statusTxt.innerText = "Acesa";
                enviarComandoHardware(letraLigar);
            } else {
                statusTxt.innerText = "Apagada";
                enviarComandoHardware(letraDesligar);
            }
        }
    </script>
</body>
</html>
